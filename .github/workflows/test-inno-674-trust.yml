name: Qualify proposed Inno 6.7.4 publisher evidence

on:
  pull_request:
    paths:
      - '.github/workflows/test-inno-674-trust.yml'
      - 'config/inno-674-component-pins.json'
      - 'tools/verify_inno674_components.py'
      - 'tools/verify_inno674_product_binary.py'
      - 'installer/Inno674CompilerProbe.iss'
      - 'installer/AJAZZBatteryTray.iss'
      - 'src/**'
      - 'global.json'
      - 'tools/Test-ProductNoticeUpgrade.ps1'
      - 'tools/stage_windows_notices.py'
      - 'tools/verify_windows_notice_transport.py'
      - 'tools/build_product_notice_sbom.py'
      - 'tools/build_scoped_windows_sbom.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inno-674-publisher:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Acquire exact official asset without execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher'
          New-Item -ItemType Directory -Path $root | Out-Null
          $asset = Join-Path $root 'innosetup-6.7.4.exe'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          curl.exe --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 90 --max-filesize 10604576 --output $asset $url
          if ($LASTEXITCODE -ne 0) { throw 'Official asset download failed' }
          $item = Get-Item -LiteralPath $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($item.Length -ne 10604576 -or $hash -cne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
            throw 'Official asset identity differs'
          }
      - name: Verify native Authenticode and exact publisher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher'
          $asset = Join-Path $root 'innosetup-6.7.4.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $asset
          if ($sig.Status -ne 'Valid' -or $sig.SignatureType -ne 'Authenticode' -or
              !$sig.SignerCertificate -or !$sig.TimeStamperCertificate) {
            throw 'Native Authenticode or timestamp evidence missing or invalid'
          }
          $cert = $sig.SignerCertificate
          $publisher = $cert.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -cne 'Pyrsys B.V.') { throw 'Unexpected official publisher' }
          $record = [ordered]@{
            schema = 'inno-publisher-authenticode-v1'
            asset_sha256 = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            status = $sig.Status.ToString()
            signature_type = $sig.SignatureType.ToString()
            publisher = $publisher
            subject = $cert.Subject
            issuer = $cert.Issuer
            signer_cert_sha256 = $cert.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
            timestamp_subject = $sig.TimeStamperCertificate.Subject
            timestamp_cert_sha256 = $sig.TimeStamperCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
            release_admission = 'NOT_VERIFIED'
          }
          $record | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'authenticode.json') -Encoding utf8
      - name: Verify immutable release attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher'
          $asset = Join-Path $root 'innosetup-6.7.4.exe'
          gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI unavailable' }
          $result = gh release verify-asset is-6_7_4 $asset --repo jrsoftware/issrc --format json
          if ($LASTEXITCODE -ne 0 -or !$result) { throw 'Official release attestation verification failed' }
          $json = $result -join "`n"
          $null = ConvertFrom-Json -InputObject $json -ErrorAction Stop
          $json | Set-Content -LiteralPath (Join-Path $root 'release-attestation.json') -Encoding utf8
      - name: Retain verification evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: inno-6.7.4-publisher-evidence
          path: ${{ runner.temp }}/ajazz-inno-674-publisher/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Deploy verified upstream portable compiler on ephemeral runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher'
          $asset = Join-Path $root 'innosetup-6.7.4.exe'
          $compiler = Join-Path $root 'portable-compiler'
          if ($env:GITHUB_ACTIONS -cne 'true' -or (Test-Path -LiteralPath $compiler)) {
            throw 'Expected fresh ephemeral runner target'
          }
          if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
            throw 'Verified asset changed'
          }
          $p = Start-Process -FilePath $asset -ArgumentList @('/PORTABLE=1','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',"/DIR=`"$compiler`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Portable compiler deployment failed' }
          python tools/verify_inno674_components.py --root $compiler --output (Join-Path $root 'components-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'Compiler input identity failed' }
      - name: Compile and exercise inert installer fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher'
          $compiler = Join-Path $root 'portable-compiler'
          $iscc = Join-Path $compiler 'ISCC.exe'
          $fixture = Join-Path $root 'AJAZZ-Inno674-Compiler-Probe.exe'
          $target = Join-Path $root 'fixture-installed'
          if ((Test-Path $fixture) -or (Test-Path $target)) { throw 'Expected fresh fixture' }
          $lines = @(& $iscc "/O$root" 'installer/Inno674CompilerProbe.iss')
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or @($lines | Where-Object { $_ -ceq 'Compiler engine version: Inno Setup 6.7.4' }).Count -ne 1) {
            throw 'Unexpected compiler result or engine banner'
          }
          python tools/verify_inno674_components.py --root $compiler --output (Join-Path $root 'components-after.json')
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $root 'components-before.json')).Hash -cne (Get-FileHash (Join-Path $root 'components-after.json')).Hash) {
            throw 'Compiler inputs changed'
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          try {
            $p = Start-Process -FilePath $fixture -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$target`"") -Wait -PassThru
            if ($p.ExitCode -ne 0 -or !(Test-Path -LiteralPath $uninstaller -PathType Leaf) -or (Get-FileHash (Join-Path $target 'LICENSE')).Hash -cne (Get-FileHash LICENSE).Hash) {
              throw 'Fixture installation or payload differs'
            }
            $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($p.ExitCode -ne 0 -or (Test-Path (Join-Path $target 'LICENSE'))) { throw 'Fixture removal failed' }
            [ordered]@{
              schema = 'inno-674-compiler-probe-v1'
              source_sha = (git rev-parse HEAD)
              engine_version = '6.7.4'
              setup_sha256 = (Get-FileHash -LiteralPath $fixture).Hash.ToLowerInvariant()
              components = 38
              component_identity = 'MATCH'
              installed_payload = 'MATCH'
              uninstalled_payload = 'REMOVED'
              product_installed = $false
              release_admission = 'NOT_VERIFIED'
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'compiler-probe.json') -Encoding utf8
          } finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
            }
          }
      - name: Retain isolated compiler qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: inno-6.7.4-compiler-probe-evidence
          path: |
            ${{ runner.temp }}/ajazz-inno-674-publisher/components-before.json
            ${{ runner.temp }}/ajazz-inno-674-publisher/components-after.json
            ${{ runner.temp }}/ajazz-inno-674-publisher/compiler-probe.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.100'
      - name: Verify selected .NET SDK
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '11.0.100') {
            throw 'Selected SDK differs from reviewed global.json'
          }
      - name: Stage exact reviewed notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe'
          New-Item -ItemType Directory -Path $root | Out-Null
          $packs = [ordered]@{
            host = 'microsoft.netcore.app.host.win-x64/11.0.0'
            core = 'microsoft.netcore.app.runtime.win-x64/11.0.0'
            desktop = 'microsoft.windowsdesktop.app.runtime.win-x64/11.0.0'
            sdk = 'microsoft.windows.sdk.net.ref/10.0.19041.87'
          }
          foreach ($entry in $packs.GetEnumerator()) {
            $parts = $entry.Value.Split('/')
            $url = "https://api.nuget.org/v3-flatcontainer/$($entry.Value)/$($parts[0]).$($parts[1]).nupkg"
            $path = Join-Path $root "$($entry.Key).nupkg"
            curl.exe --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 120 --max-filesize 268435456 --output $path $url
            if ($LASTEXITCODE -ne 0) { throw 'Pinned pack download failed' }
          }
          python tools/stage_windows_notices.py --host (Join-Path $root 'host.nupkg') --core (Join-Path $root 'core.nupkg') --desktop (Join-Path $root 'desktop.nupkg') --sdk (Join-Path $root 'sdk.nupkg') --output (Join-Path $root 'staged')
          if ($LASTEXITCODE -ne 0) { throw 'Notice staging failed' }
          python tools/verify_windows_notice_transport.py --tree (Join-Path $root 'staged') --output (Join-Path $root 'staged-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'Notice identity failed' }
      - name: Build unpublished product notice probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe'
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj -c Release -r win-x64 --self-contained true -p:Version=0.3.0-beta.61 -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Product probe publish failed' }
          $compiler = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher/portable-compiler'
          python tools/verify_inno674_components.py --root $compiler --output (Join-Path $root 'product-components-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'Product compiler input identity failed' }
          $iscc = Join-Path $compiler 'ISCC.exe'
          $lines = @(& $iscc '/DAppVersion=0.3.0-beta.61' '/DProductNoticeProbe=1' '/FAJAZZBatteryTray-Inno674-Notice-Probe-win-x64' "/DNoticeRoot=$(Join-Path $root 'staged')" "/O$root" 'installer/AJAZZBatteryTray.iss')
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or @($lines | Where-Object { $_ -ceq 'Compiler engine version: Inno Setup 6.7.4' }).Count -ne 1) {
            throw 'Product probe compilation failed or engine differs'
          }
          if (!(Test-Path -LiteralPath (Join-Path $root 'AJAZZBatteryTray-Inno674-Notice-Probe-win-x64.exe') -PathType Leaf)) {
            throw 'Distinct 6.7.4 output missing'
          }
          python tools/verify_inno674_components.py --root $compiler --output (Join-Path $root 'product-components-after.json')
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $root 'product-components-before.json')).Hash -cne (Get-FileHash (Join-Path $root 'product-components-after.json')).Hash) {
            throw 'Product compiler inputs changed'
          }
      - name: Verify product notice lifecycle without tray launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe'
          $setup = Join-Path $root 'AJAZZBatteryTray-Inno674-Notice-Probe-win-x64.exe'
          $target = Join-Path $root 'product-installed'
          $app = Join-Path $target 'AJAZZBatteryTray.exe'
          $uninstaller = Join-Path $target 'unins000.exe'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{9829045F-37F0-4AC3-ACBD-1B5E4129A179}_is1'
          $data = Join-Path $env:APPDATA 'AJAZZBatteryTray'
          if (!(Test-Path -LiteralPath $setup -PathType Leaf) -or (Test-Path $target) -or (Test-Path $key) -or (Test-Path $data) -or (Get-Process -Name AJAZZBatteryTray -ErrorAction SilentlyContinue)) {
            throw 'Expected clean isolated product probe target'
          }
          $expected = (Get-FileHash -LiteralPath 'dist/app/AJAZZBatteryTray.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          try {
            $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LAUNCH=0',"/DIR=`"$target`"") -Wait -PassThru
            if ($p.ExitCode -ne 0 -or !(Test-Path -LiteralPath $app -PathType Leaf) -or !(Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw 'Product probe installation failed'
            }
            if ((Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected -or (Get-ItemProperty -LiteralPath $key).DisplayVersion -cne '0.3.0-beta.61' -or (Get-Process -Name AJAZZBatteryTray -ErrorAction SilentlyContinue) -or (Test-Path $data)) {
              throw 'Unexpected product identity or launch'
            }
            foreach ($name in @('AppIcon.ico','AppIcon-white.ico','AppIcon-black.ico','AppIcon-blue.ico')) {
              if ((Get-FileHash -LiteralPath (Join-Path $target "Icons/$name")).Hash -cne (Get-FileHash -LiteralPath "src/AjazzBatteryTray/Assets/$name").Hash) { throw 'Product icon differs' }
            }
            python tools/verify_windows_notice_transport.py --tree (Join-Path $target 'Notices') --output (Join-Path $root 'product-installed-evidence.json')
            if ($LASTEXITCODE -ne 0) { throw 'Product notices differ' }
            $capture = Join-Path $root 'exercised-unins000.exe'
            if (Test-Path -LiteralPath $capture) { throw 'Uninstaller capture already exists' }
            $hash = (Get-FileHash -LiteralPath $uninstaller -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath $uninstaller -Destination $capture
            if ((Get-FileHash -LiteralPath $capture -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash -or
                (Get-FileHash -LiteralPath $uninstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) {
              throw 'Uninstaller capture differs'
            }
            $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($p.ExitCode -ne 0 -or (Test-Path $app) -or (Test-Path $key) -or (Test-Path $data) -or (Test-Path (Join-Path $target 'Icons')) -or (Test-Path (Join-Path $target 'Notices'))) {
              throw 'Product probe uninstall cleanup failed'
            }
            [ordered]@{
              schema = 'product-notice-probe-v1'
              source_sha = (git rev-parse HEAD)
              setup_sha256 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
              app_sha256 = $expected
              installed_notices = 'MATCH'
              uninstalled_notices = 'REMOVED'
              tray_launch = 'NOT_OBSERVED'
              physical_acceptance = 'NOT_VERIFIED'
              release_admission = 'NOT_VERIFIED'
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'product-lifecycle.json') -Encoding utf8
            [ordered]@{
              schema = 'inno-674-exercised-uninstaller-v1'
              source_sha = (git rev-parse HEAD)
              setup_sha256 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
              app_sha256 = $expected
              uninstaller_sha256 = $hash
              uninstall_result = 'REMOVED'
              release_admission = 'NOT_VERIFIED'
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'exercised-uninstaller.json') -Encoding utf8
          } finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
            }
          }
      - name: Retain product probe JSON evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: inno674-product-notice-probe-evidence
          path: |
            ${{ runner.temp }}/ajazz-notice-probe/product-installed-evidence.json
            ${{ runner.temp }}/ajazz-notice-probe/product-lifecycle.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify upgrade and reinstall with exact notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Test-ProductNoticeUpgrade.ps1 -ProbeRoot (Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe') -CandidateName 'AJAZZBatteryTray-Inno674-Notice-Probe-win-x64.exe'
      - name: Retain upgrade probe JSON evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: inno674-product-notice-upgrade-evidence
          path: |
            ${{ runner.temp }}/ajazz-notice-probe/product-upgrade-notices.json
            ${{ runner.temp }}/ajazz-notice-probe/product-reinstall-notices.json
            ${{ runner.temp }}/ajazz-notice-probe/product-upgrade-lifecycle.json
          if-no-files-found: error
          retention-days: 7

      - name: Bind scoped SBOM to exercised product probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe'
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cnotmatch '^[0-9a-f]{40}$') { throw 'Checkout identity unavailable' }
          python tools/build_product_notice_sbom.py --app dist/app/AJAZZBatteryTray.exe --setup (Join-Path $root 'AJAZZBatteryTray-Inno674-Notice-Probe-win-x64.exe') --clean (Join-Path $root 'product-lifecycle.json') --upgrade (Join-Path $root 'product-upgrade-lifecycle.json') --source-sha $source --host (Join-Path $root 'host.nupkg') --core (Join-Path $root 'core.nupkg') --desktop (Join-Path $root 'desktop.nupkg') --sdk (Join-Path $root 'sdk.nupkg') --sbom (Join-Path $root 'product-scoped-sbom.json') --output (Join-Path $root 'product-sbom-binding.json')
          if ($LASTEXITCODE -ne 0) { throw 'Scoped product SBOM failed' }
      - name: Bind reviewed 6.7.4 inputs to product lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe'
          $binding = Get-Content -Raw -LiteralPath (Join-Path $root 'product-sbom-binding.json') | ConvertFrom-Json
          $setup = Join-Path $root 'AJAZZBatteryTray-Inno674-Notice-Probe-win-x64.exe'
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($binding.setup_sha256 -cne $setupHash -or $binding.source_sha -cne (git rev-parse HEAD)) {
            throw 'Product lifecycle identity differs'
          }
          [ordered]@{
            schema = 'inno-674-product-binding-v1'
            source_sha = $binding.source_sha
            engine_version = '6.7.4'
            setup_sha256 = $setupHash
            app_sha256 = $binding.app_sha256
            sbom_sha256 = $binding.sbom_sha256
            component_evidence_sha256 = (Get-FileHash -LiteralPath (Join-Path $root 'product-components-after.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            product_binding_sha256 = (Get-FileHash -LiteralPath (Join-Path $root 'product-sbom-binding.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            interactive_acceptance = 'NOT_VERIFIED'
            release_admission = 'NOT_VERIFIED'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'inno674-product-binding.json') -Encoding utf8
      - name: Retain candidate-bound SBOM evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: inno674-product-notice-sbom-evidence
          path: |
            ${{ runner.temp }}/ajazz-notice-probe/product-scoped-sbom.json
            ${{ runner.temp }}/ajazz-notice-probe/product-sbom-binding.json
            ${{ runner.temp }}/ajazz-notice-probe/product-components-before.json
            ${{ runner.temp }}/ajazz-notice-probe/product-components-after.json
            ${{ runner.temp }}/ajazz-notice-probe/inno674-product-binding.json
          if-no-files-found: error
          retention-days: 7

      - name: Attribute exact product setup and exercised uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ajazz-notice-probe'
          $compiler = Join-Path $env:RUNNER_TEMP 'ajazz-inno-674-publisher/portable-compiler'
          python tools/verify_inno674_product_binary.py --setup (Join-Path $root 'AJAZZBatteryTray-Inno674-Notice-Probe-win-x64.exe') --uninstaller (Join-Path $root 'exercised-unins000.exe') --loader (Join-Path $compiler 'SetupLdr.e32') --engine (Join-Path $compiler 'Setup.e32') --binding (Join-Path $root 'inno674-product-binding.json') --exercised (Join-Path $root 'exercised-uninstaller.json') --output (Join-Path $root 'binary-attribution.json')
          if ($LASTEXITCODE -ne 0) { throw 'Product binary attribution failed' }
      - name: Retain scoped binary attribution JSON only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: inno674-product-binary-attribution
          path: |
            ${{ runner.temp }}/ajazz-notice-probe/exercised-uninstaller.json
            ${{ runner.temp }}/ajazz-notice-probe/binary-attribution.json
          if-no-files-found: error
          retention-days: 7
