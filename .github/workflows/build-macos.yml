name: Build macOS experimental app

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'tests/fixtures/apex-f7-v1.csv'
      - 'tools/check_apple_io_lease.py'
      - 'tools/verify_apple_group_catalog.py'
      - 'tests/fixtures/apple-native-groups-v1.json'
      - 'tools/measure_apple_worker.py'
      - '.github/workflows/build-macos.yml'
      - 'src/AjazzBatteryTray/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    # Intel macOS runner avoids arm64 queue saturation; swiftc cross-builds both architectures.
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record selected Apple toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftc --version
          clang --version | sed -n '1p'
          xcrun --sdk macosx --show-sdk-version
      - name: Build universal menu-bar app
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/ajazz-universal-build.txt"
          review="$RUNNER_TEMP/ajazz-universal-group-review.json"
          test ! -e "$capture"
          test ! -e "$review"
          bash macos/build-macos.sh | tee "$capture"
          python3 tools/verify_apple_group_catalog.py --edition universal --capture "$capture" --output "$review"
      - name: Retain scoped native Apple group review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: apple-universal-native-group-review
          path: ${{ runner.temp }}/ajazz-universal-group-review.json
          if-no-files-found: error
      - name: Verify shared vendor I/O gate without HID
        run: |
          python3 tools/check_apple_io_lease.py --exe "dist/mac/AJAZZ Battery Tray.app/Contents/MacOS/AJAZZBatteryTray"
      - name: Measure synthetic worker startup without HID
        run: |
          python3 tools/measure_apple_worker.py --dry-run
          python3 tools/measure_apple_worker.py --exe "dist/mac/AJAZZ Battery Tray.app/Contents/MacOS/AJAZZBatteryTray" --output "$RUNNER_TEMP/macos-universal-worker.csv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: macos-universal-worker-startup-baseline
          path: ${{ runner.temp }}/macos-universal-worker.csv
          if-no-files-found: error
      - name: Upload macOS ZIP (one extraction)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: AJAZZBatteryTray-macOS-universal-experimental
          path: |
            dist/AJAZZBatteryTray-macOS-universal.zip
            dist/AJAZZBatteryTray-macOS-universal.sha256
          if-no-files-found: error
