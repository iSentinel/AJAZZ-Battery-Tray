name: Build Windows portable app

on:
  push:
    branches: [main]
    paths:
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/inventory_nuget_assets.py'
      - 'tools/run_offline_qa.py'
      - 'tools/Measure-TrayResources.ps1'
      - 'tools/Measure-TrayJobCpu.ps1'
      - 'tools/TrayJobAccounting.cs'
      - 'tools/Measure-PollWorker.ps1'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.428'
      - name: Verify selected .NET SDK
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '8.0.428') {
            throw 'Selected SDK differs from reviewed global.json'
          }
          Write-Host "Selected .NET SDK: $actual"
          dotnet --list-runtimes | ForEach-Object {
            if ($_ -match '^([A-Za-z0-9.]+) ([0-9.]+) \[') {
              Write-Host ("Available runtime: " + $Matches[1] + " " + $Matches[2])
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inventory failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.17'
      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet run -c Release --project tests/AjazzBatteryTray.Tests/AjazzBatteryTray.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Smoke-test localized Device Manager controls
        run: dotnet run -c Release --project tests/AjazzDashboard.Smoke
      - name: Smoke-test cumulative process-tree CPU accounting
        shell: pwsh
        run: ./tools/Measure-TrayJobCpu.ps1 -SelfTest
      - name: Smoke-test resource sampler
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP ('ajazz-resource-' + [Guid]::NewGuid().ToString('N') + '.csv')
          try {
            & ./tools/Measure-TrayResources.ps1 -ProcessId $PID -DurationSeconds 30 -IntervalSeconds 10 -IncludeGuiResources -OutputPath $output
            $rows = @(Import-Csv -LiteralPath $output)
            if ($rows.Count -lt 3 -or [double]$rows[-1].elapsed_seconds -lt 29 -or
                [long]$rows[-1].private_bytes -le 0 -or [int]$rows[-1].threads -le 0 -or
                [long]$rows[-1].gdi_objects -lt 0 -or [long]$rows[-1].user_objects -lt 0) {
              throw 'Invalid resource sampler output'
            }
            $rejected = $false
            try { & ./tools/Measure-TrayResources.ps1 -ProcessId $PID -DurationSeconds 30 -OutputPath $output }
            catch { $rejected = $_.Exception.Message -like '*Output already exists*' }
            if (-not $rejected) { throw 'Sampler must reject existing output' }
          } finally {
            Remove-Item -LiteralPath $output -ErrorAction SilentlyContinue
          }
      - name: Record framework restore inventories
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'ajazz-nuget-inventory'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          dotnet restore src/AjazzBatteryTray/AjazzBatteryTray.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Framework restore failed' }
          python tools/inventory_nuget_assets.py --assets 'src/AjazzBatteryTray/obj/project.assets.json' --output (Join-Path $evidence 'tray-framework.json')
          if ($LASTEXITCODE -ne 0) { throw 'Restore inventory failed: tray-framework' }
          python tools/inventory_nuget_assets.py --assets 'tests/AjazzBatteryTray.Tests/obj/project.assets.json' --output (Join-Path $evidence 'unit-tests.json')
          if ($LASTEXITCODE -ne 0) { throw 'Restore inventory failed: unit-tests' }
          python tools/inventory_nuget_assets.py --assets 'tests/AjazzDashboard.Smoke/obj/project.assets.json' --output (Join-Path $evidence 'dashboard-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Restore inventory failed: dashboard-smoke' }
      - name: Publish single-file Windows executable
        shell: pwsh
        run: |
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
      - name: Record tray win-x64 publish restore inventory
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'ajazz-nuget-inventory'
          python tools/inventory_nuget_assets.py --assets 'src/AjazzBatteryTray/obj/project.assets.json' --output (Join-Path $evidence 'tray-win-x64.json')
          if ($LASTEXITCODE -ne 0) { throw 'Restore inventory failed: tray-win-x64' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-nuget-restore-inventory
          path: |
            ${{ runner.temp }}/ajazz-nuget-inventory/tray-framework.json
            ${{ runner.temp }}/ajazz-nuget-inventory/unit-tests.json
            ${{ runner.temp }}/ajazz-nuget-inventory/dashboard-smoke.json
            ${{ runner.temp }}/ajazz-nuget-inventory/tray-win-x64.json
          if-no-files-found: error
      - name: Verify job CPU sampler preflight
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $path = Join-Path $env:RUNNER_TEMP ('ajazz-job-dry-' + [Guid]::NewGuid().ToString('N') + '.csv')
          $dry = & ./tools/Measure-TrayJobCpu.ps1 -ExePath $exe -OutputPath $path -Mode Isolated -DryRun -DurationSeconds 30 -IntervalSeconds 15
          if ($dry -notmatch 'DRY-RUN' -or (Test-Path -LiteralPath $path)) {
            throw 'Preflight did not remain side-effect free'
          }
          if (Get-Process -Name AJAZZBatteryTray -ErrorAction SilentlyContinue) {
            throw 'Preflight started tray'
          }
          $rejected = $false
          try {
            & ./tools/Measure-TrayJobCpu.ps1 -ExePath $exe -OutputPath $path -DryRun -DurationSeconds 30 -IntervalSeconds 16
          } catch {
            $rejected = $_.Exception.Message -like '*half the duration*'
          }
          if (-not $rejected -or (Test-Path -LiteralPath $path)) {
            throw 'Invalid sample interval was not rejected'
          }
      - name: Measure synthetic worker startup baseline
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $output = Join-Path $env:RUNNER_TEMP 'ajazz-worker-baseline.csv'
          $dry = & ./tools/Measure-PollWorker.ps1 -ExePath $exe -OutputPath $output -DryRun
          if ($dry -notmatch 'DRY-RUN' -or (Test-Path -LiteralPath $output)) {
            throw 'Worker benchmark dry-run had a side effect'
          }
          & ./tools/Measure-PollWorker.ps1 -ExePath $exe -OutputPath $output -Iterations 20
          $rows = @(Import-Csv -LiteralPath $output)
          if ($rows.Count -ne 20 -or @($rows | Where-Object {
              [double]$_.elapsed_ms -le 0 -or [int]$_.stdout_bytes -le 0
          }).Count -ne 0) { throw 'Invalid worker baseline' }
          $before = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
          $refused = $false
          try { & ./tools/Measure-PollWorker.ps1 -ExePath $exe -OutputPath $output -Iterations 5 }
          catch { $refused = $_.Exception.Message -like '*Output already exists*' }
          if (-not $refused -or (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash -ne $before) {
            throw 'Existing benchmark report was modified'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-worker-startup-baseline
          path: ${{ runner.temp }}/ajazz-worker-baseline.csv
          if-no-files-found: error
      - name: Verify opt-in Windows HID diagnostic watchdog
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP ('ajazz-hid-watchdog-' + [Guid]::NewGuid().ToString('N') + '.txt')
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          try {
            $p = Start-Process -FilePath $exe -ArgumentList @(
              '--self-test-hid-watchdog', '--output', $report
            ) -PassThru -Wait
            if ($p.ExitCode -ne 124) { throw "Expected 124, got $($p.ExitCode)" }
            $contents = Get-Content -LiteralPath $report -Raw
            foreach ($mark in @('BEGIN:', 'STEP: worker started', 'TIMEOUT:')) {
              if ($contents -notlike ('*' + $mark + '*')) { throw "Missing marker $mark" }
            }
            $existing = Start-Process -FilePath $exe -ArgumentList @(
              '--self-test-hid-watchdog', '--output', $report
            ) -PassThru -Wait
            if ($existing.ExitCode -eq 0) { throw 'Existing diagnostics file was reused' }
            if ((Get-Content -LiteralPath $report -Raw) -ne $contents) {
              throw 'Existing diagnostic output was modified'
            }
            echo 'PASS: bounded worker, persistent progress, no report clobber'
          } finally {
            Remove-Item -LiteralPath $report -ErrorAction SilentlyContinue
          }
      - name: GET ID comparison refuses active tray without HID
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $log = Join-Path $env:RUNNER_TEMP ('ajazz-get-id-' + [Guid]::NewGuid().ToString('N') + '.txt')
          $guard = [Threading.Mutex]::new($true, 'Local\AJAZZBatteryTray_AJ179_APEX')
          try {
            $arguments = '--hid-compare-get-ids --timeout 40 --output "' + $log + '"'
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit(10000)) { $p.Kill($true); throw 'Comparison guard hung' }
            if ($p.ExitCode -ne 1) { throw "Expected refusal, got $($p.ExitCode)" }
            if ((Get-Content -LiteralPath $log -Raw) -notmatch 'close AJAZZ Battery Tray') {
              throw 'Missing explicit refusal marker'
            }
            echo 'PASS: experimental comparison refuses active tray'
          } finally {
            $guard.Dispose()
            Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          }
      - name: Verify cross-process AJAZZ vendor I/O exclusion without HID
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $log = Join-Path $env:RUNNER_TEMP ('ajazz-busy-' + [Guid]::NewGuid().ToString('N') + '.txt')
          $gate = [Threading.Mutex]::new($false, 'Local\AJAZZBatteryTray_ApexVendorIo_v1')
          $held = $gate.WaitOne(0)
          try {
            if (-not $held) { throw 'Fixture could not acquire gate' }
            $arguments = '--hid-diagnose --timeout 8 --output "' + $log + '"'
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit(12000)) { $p.Kill($true); throw 'Busy check hung' }
            $body = Get-Content -LiteralPath $log -Raw
            if ($p.ExitCode -ne 2 -or $body -notmatch 'vendor I/O busy' -or
                $body -match 'enumerating receiver HID paths|SET F7 begin') {
              throw 'Busy worker attempted HID or misclassified presence'
            }
            echo 'PASS: busy gate prevents HID and returns unknown'
          } finally {
            if ($held) { $gate.ReleaseMutex() }
            $gate.Dispose()
            Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          }
      - name: Verify prototype routine worker timeout and recovery without HID
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test-routine-poll-worker' -PassThru
          if (-not $p.WaitForExit(25000)) { $p.Kill($true); throw 'Routine worker self-test hung' }
          if ($p.ExitCode -ne 0) { throw "Routine worker self-test failed: $($p.ExitCode)" }
          echo 'PASS: deferred keys, overlap rejection, timeout, shutdown cancellation, recovery'
      - name: Verify full GUI capture watchdog without HID
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test-full-hid-watchdog' -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill($true); throw 'Capture worker hung' }
          if ($p.ExitCode -ne 124 -or $timer.Elapsed.TotalSeconds -lt 1) { throw 'Expected a bounded timeout' }
      - name: Validate owner HID acceptance helper
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP ('ajazz-owner-' + [Guid]::NewGuid().ToString('N'))
          $exe = (Resolve-Path 'dist/app/AJAZZBatteryTray.exe').Path
          $helper = (Resolve-Path 'tools/Collect-AjazzHidDiagnostics.ps1').Path
          $dry = & $helper -DryRun -ExePath $exe -OutputDirectory $dir -Label awake
          if (($dry -join ' ') -notmatch 'DRY-RUN' -or (Test-Path $dir)) {
            throw 'Dry-run wrote output or failed'
          }
          New-Item -ItemType Directory -Path $dir | Out-Null
          try {
            $args = '-NoLogo -NoProfile -File "' + $helper +
              '" -SelfTest -Label watchdog -ExePath "' + $exe +
              '" -OutputDirectory "' + $dir + '"'
            $run = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $args -Wait -PassThru
            if ($run.ExitCode -ne 124) { throw "Expected watchdog 124, got $($run.ExitCode)" }
            $logs = @(Get-ChildItem -LiteralPath $dir -Filter 'ajazz-hid-watchdog-*.txt')
            if ($logs.Count -ne 1) { throw 'Expected exactly one owner report' }
            $body = Get-Content -LiteralPath $logs[0].FullName -Raw
            if ($body -notmatch 'BEGIN:' -or $body -notmatch 'TIMEOUT:') {
              throw 'Missing persisted watchdog progress'
            }
            echo 'PASS: owner wrapper dry-run, bounded self-test and one report'
          } finally {
            Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Package shortcut icon choices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/app/Icons | Out-Null
          foreach ($name in @('AppIcon.ico','AppIcon-white.ico','AppIcon-black.ico','AppIcon-blue.ico')) {
            $source = Join-Path 'src/AjazzBatteryTray/Assets' $name
            $target = Join-Path 'dist/app/Icons' $name
            Copy-Item -LiteralPath $source -Destination $target
            if ((Get-FileHash $source).Hash -ne (Get-FileHash $target).Hash) {
              throw "Icon copy mismatch: $name"
            }
          }
          echo 'PASS: four shortcut ICO files packaged'
      # upload-artifact already delivers a ZIP download. Upload the executable
      # directory, not a pre-zipped archive, to avoid nested ZIP files.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AJAZZBatteryTray-win-x64
          path: dist/app/
          if-no-files-found: error
          compression-level: 6
