name: Build Windows portable app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run unit tests
        run: dotnet run -c Release --project tests/AjazzBatteryTray.Tests/AjazzBatteryTray.Tests.csproj
      - name: Publish single-file Windows executable
        shell: pwsh
        run: |
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -o dist/app
          Compress-Archive -Path dist/app/* -DestinationPath dist/AJAZZBatteryTray-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AJAZZBatteryTray-win-x64
          path: dist/AJAZZBatteryTray-win-x64.zip
          if-no-files-found: error
