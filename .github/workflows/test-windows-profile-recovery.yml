name: Test native Windows profile recovery

on:
  pull_request:
    paths:
      - '.github/workflows/test-windows-profile-recovery.yml'
      - 'tools/backup_windows_profile.py'
      - 'tools/test_backup_windows_profile.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.17'
      - name: Exercise synthetic profile backup and recovery
        run: python -m unittest discover -s tools -p 'test_backup_windows_profile.py' -v
      - name: Check CLI help
        run: python tools/backup_windows_profile.py --help
