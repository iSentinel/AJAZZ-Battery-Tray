name: Test offline developer tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'config/code-audit-baseline.json'
      - '.github/workflows/release-*.yml'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
      - '.github/workflows/test-tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'config/code-audit-baseline.json'
      - '.github/workflows/release-*.yml'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
      - '.github/workflows/test-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run provider-independent offline QA
        run: python tools/run_offline_qa.py
      - name: Preserve sanitized required QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-python-qa
          path: artifacts/offline-qa-*/*
          if-no-files-found: error
