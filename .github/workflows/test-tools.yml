name: Test offline developer tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'config/code-audit-baseline.json'
      - 'config/ci-actions-lock.json'
      - '.github/workflows/**'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
  pull_request:
    paths:
      - 'tools/**'
      - 'config/code-audit-baseline.json'
      - 'config/ci-actions-lock.json'
      - '.github/workflows/**'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - name: Run provider-independent offline QA
        run: python tools/run_offline_qa.py
      - name: Preserve sanitized required QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-python-qa
          path: artifacts/offline-qa-*/*
          if-no-files-found: error
