name: Test offline developer tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'config/code-audit-baseline.json'
      - 'config/ci-actions-lock.json'
      - 'global.json'
      - '.github/workflows/**'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
  pull_request:
    paths:
      - 'tools/**'
      - 'config/code-audit-baseline.json'
      - 'config/ci-actions-lock.json'
      - 'global.json'
      - '.github/workflows/**'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: Run provider-independent offline QA
        run: python tools/run_offline_qa.py
      - name: Preserve sanitized required QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: offline-python-qa
          path: artifacts/offline-qa-*/*
          if-no-files-found: error
      - name: Prepare synthetic artifact roundtrip
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ajazz-ci-roundtrip"
          printf '%s\n' 'ajazz-synthetic-a' > "$RUNNER_TEMP/ajazz-ci-roundtrip/a.txt"
          printf '%s\n' 'ajazz-synthetic-b' > "$RUNNER_TEMP/ajazz-ci-roundtrip/b.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: ci-roundtrip-a
          path: ${{ runner.temp }}/ajazz-ci-roundtrip/a.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: ci-roundtrip-b
          path: ${{ runner.temp }}/ajazz-ci-roundtrip/b.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          pattern: ci-roundtrip-*
          merge-multiple: true
          path: ${{ runner.temp }}/ajazz-ci-roundtrip-download
      - name: Verify synthetic artifact roundtrip
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/ajazz-ci-roundtrip"
          downloaded="$RUNNER_TEMP/ajazz-ci-roundtrip-download"
          test "$(find "$downloaded" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$(printf 'a.txt\nb.txt\n')"
          cmp "$original/a.txt" "$downloaded/a.txt"
          cmp "$original/b.txt" "$downloaded/b.txt"
          echo 'PASS: synthetic merged artifact roundtrip'
