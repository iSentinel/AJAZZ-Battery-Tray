name: Test offline developer tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/release-*.yml'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
      - '.github/workflows/test-tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/release-*.yml'
      - 'tests/fixtures/**'
      - 'macos/AjazzBatteryReport.h'
      - '.github/workflows/test-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regressions
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate help
        run: |
          python tools/compare_apex_reports.py --help
          python tools/compare_tray_resources.py --help
          python tools/compare_job_cpu.py --help
          python tools/analyze_aula_sleep.py --help
          python tools/compare_windows_hid_logs.py --help
          python tools/compare_get_ids.py --help
          python tools/compare_ready_clear.py --help
          python tools/code_audit.py --help
      - name: Inventory Python engineering debt (not qualification)
        run: |
          mkdir -p artifacts
          python tools/code_audit.py --inventory > artifacts/code-audit.json
      - name: Preserve source-only audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-inventory
          path: artifacts/code-audit.json
          if-no-files-found: error
