name: Build macOS High Sierra Intel

on:
  pull_request:
    paths:
      - 'macos/high-sierra/**'
      - 'tools/measure_apple_worker.py'
      - 'macos/AjazzBatteryReport.h'
      - '.github/workflows/build-high-sierra.yml'
      - '.github/workflows/release-high-sierra.yml'
  push:
    branches: [main]
    paths:
      - 'macos/high-sierra/**'
      - 'tools/measure_apple_worker.py'
      - 'macos/AjazzBatteryReport.h'
      - '.github/workflows/build-high-sierra.yml'
  workflow_dispatch:

jobs:
  build-high-sierra:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build native Intel app and run parser tests
        run: bash macos/high-sierra/build.sh
      - name: Measure synthetic worker startup without HID
        run: |
          python3 tools/measure_apple_worker.py --dry-run
          python3 tools/measure_apple_worker.py --exe "dist/high-sierra/AJAZZ Battery Tray High Sierra.app/Contents/MacOS/AJAZZBatteryTrayHighSierra" --output "$RUNNER_TEMP/macos-high-sierra-intel-worker.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-high-sierra-intel-worker-startup-baseline
          path: ${{ runner.temp }}/macos-high-sierra-intel-worker.csv
          if-no-files-found: error
      - name: Validate hardware acceptance helper without USB traffic
        run: |
          bash -n macos/high-sierra/acceptance.sh
          bash macos/high-sierra/acceptance.sh --help
          bash macos/high-sierra/acceptance.sh --dry-run --trace
          bash macos/high-sierra/acceptance.sh --dry-run --app \
            "dist/high-sierra/AJAZZ Battery Tray High Sierra.app"
      - name: Watchdog, unbuffered report, and private log safety
        shell: bash
        run: |
          set -euo pipefail
          EXE="dist/high-sierra/AJAZZ Battery Tray High Sierra.app/Contents/MacOS/AJAZZBatteryTrayHighSierra"
          REPORT="$RUNNER_TEMP/ajazz-watchdog-test.txt"
          set +e
          "$EXE" --self-test-watchdog --output "$REPORT"
          code=$?
          set -e
          test "$code" -eq 124
          grep -q 'BEGIN: diagnostic=' "$REPORT"
          grep -q 'TEST: worker started' "$REPORT"
          grep -q 'TIMEOUT: worker exceeded' "$REPORT"
          test "$(stat -f %Lp "$REPORT")" = 600
          ln -s "$REPORT" "$REPORT.symlink"
          if "$EXE" --self-test-watchdog --output "$REPORT.symlink"; then
            echo "FAIL: followed diagnostic log symlink"
            exit 1
          fi
          if "$EXE" --trace-hid --timeout invalid; then
            echo "FAIL: invalid timeout accepted"
            exit 1
          fi
          echo "PASS: 1s worker timeout, diagnostic log and symlink guard"
      - name: Check package target, architecture, and SHA256
        run: |
          set -euo pipefail
          APP="dist/high-sierra/AJAZZ Battery Tray High Sierra.app"
          EXE="$APP/Contents/MacOS/AJAZZBatteryTrayHighSierra"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")" = 10.13
          lipo -info "$EXE" | grep -q x86_64
          if otool -L "$EXE" | grep -iq libswift; then exit 1; fi
          (cd dist && shasum -a 256 -c AJAZZBatteryTray-macOS-HighSierra-Intel.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: AJAZZBatteryTray-HighSierra-Intel
          path: |
            dist/AJAZZBatteryTray-macOS-HighSierra-Intel.zip
            dist/AJAZZBatteryTray-macOS-HighSierra-Intel.sha256
          if-no-files-found: error
