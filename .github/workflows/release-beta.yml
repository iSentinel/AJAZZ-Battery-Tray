name: Publish cross-platform beta release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'macos/**'
      - '.github/workflows/release-beta.yml'
      - 'installer/**'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and build Windows
        shell: pwsh
        run: |
          dotnet run -c Release --project tests/AjazzBatteryTray.Tests/AjazzBatteryTray.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/app/AJAZZBatteryTray.exe dist/release/AJAZZBatteryTray-win-x64.exe
          $hash = (Get-FileHash dist/release/AJAZZBatteryTray-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AJAZZBatteryTray-win-x64.exe" | Set-Content -Encoding ascii dist/release/AJAZZBatteryTray-win-x64.sha256
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build Windows installer and smoke-test install/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc "installer\AJAZZBatteryTray.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = 'dist/installer/AJAZZBatteryTray-Setup-win-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer output missing' }
          $installDir = Join-Path $env:ProgramFiles 'AJAZZ Battery Tray'
          $p = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $installed = Join-Path $installDir 'AJAZZBatteryTray.exe'
          if (-not (Test-Path $installed)) { throw 'Missing EXE in Program Files' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (Test-Path $installed) { throw 'EXE remains after uninstall' }
          Copy-Item $installer dist/release/
          $hash = (Get-FileHash dist/release/AJAZZBatteryTray-Setup-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AJAZZBatteryTray-Setup-win-x64.exe" | Set-Content -Encoding ascii dist/release/AJAZZBatteryTray-Setup-win-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS universal app
        run: bash macos/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            dist/AJAZZBatteryTray-macOS-universal.zip
            dist/AJAZZBatteryTray-macOS-universal.sha256
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.2.0-beta.3"
          cat > notes.md <<'NOTES'
          ## AJAZZ Battery Tray v0.2.0-beta.3 — Windows and macOS

          Battery and dock clock synchronization in the notification area on Windows 10/11 and the
          native menu bar on macOS 13+ (Intel or Apple Silicon).

          **Windows:** AJ179 APEX 2.4 GHz / 8K battery display confirmed on
          real hardware. The UI uses the neutral name AJAZZ APEX, and AJ159
          APEX is included as an experimental compatible receiver.

          **macOS:** first native Swift/AppKit/IOKit build. Builds on macOS
          CI, but the actual mouse's HID reply still needs real Mac testing.
          Download the macOS ZIP and extract it once to get the .app.
          The app is ad-hoc signed, not notarized by Apple. Gatekeeper may
          request approval in Privacy & Security.

          **Dock Clock Sync:** Manual or five-minute automatic RTC update using
          the documented 0x28 feature report. The host writes local system time.
          Clock display update still needs real-device confirmation.

          **Protocol:** USB VID 3151 PID 5007, vendor HID usage FFFF:0002.
          **Not supported yet:** Bluetooth, charging state, two receivers
          distinguished at once. Mac low-battery alerts and login autostart
          are not yet included.

          Windows recommended installer: AJAZZBatteryTray-Setup-win-x64.exe
          Installs to Program Files, provides Start menu and standard uninstall.
          Administrator permission is required only to install/uninstall.
          Portable Windows download: AJAZZBatteryTray-win-x64.exe
          macOS download: AJAZZBatteryTray-macOS-universal.zip
          SHA256 checksum files accompany every distribution.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refresh beta assets"
            gh release upload "$TAG" dist/release/AJAZZBatteryTray-win-x64.exe \
              dist/release/AJAZZBatteryTray-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-Setup-win-x64.exe \
              dist/release/AJAZZBatteryTray-Setup-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-macOS-universal.zip \
              dist/release/AJAZZBatteryTray-macOS-universal.sha256 --clobber
          else
            gh release create "$TAG" \
              dist/release/AJAZZBatteryTray-win-x64.exe \
              dist/release/AJAZZBatteryTray-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-Setup-win-x64.exe \
              dist/release/AJAZZBatteryTray-Setup-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-macOS-universal.zip \
              dist/release/AJAZZBatteryTray-macOS-universal.sha256 \
              --target "$GITHUB_SHA" --title "AJAZZ Battery Tray v0.2.0-beta.3" \
              --notes-file notes.md --prerelease
          fi
