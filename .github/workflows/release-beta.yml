name: Publish cross-platform beta release

on:
  workflow_dispatch:

concurrency:
  group: ajazz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require qualified candidate admission
        run: |
          echo 'BLOCKED: release admission not yet qualified (ENG-10).'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate package versions and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's|.*<Version>([^<]+)</Version>.*|\1|p' src/AjazzBatteryTray/AjazzBatteryTray.csproj)"
          SETUP_VERSION="$(sed -nE 's/^#define AppVersion "([^"]+)".*/\1/p' installer/AJAZZBatteryTray.iss)"
          MAC_VERSION="$(sed -nE 's|.*<key>CFBundleShortVersionString</key><string>([^<]+)</string>.*|\1|p' macos/Info.plist)"
          RELEASE_TAG="$(sed -nE 's/^[[:space:]]*TAG="(v[^"]+)".*/\1/p' .github/workflows/release-beta.yml)"
          if [[ -z "$APP_VERSION" ||
                "$SETUP_VERSION" != "$APP_VERSION" ||
                "$MAC_VERSION" != "${APP_VERSION%%-*}" ||
                "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
            echo "::error::Release version mismatch between app, installer, macOS and workflow."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; bump versions before publishing."
            exit 1
          fi
          echo "PASS: $RELEASE_TAG metadata matches and tag is not published."

  windows:
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.100'
      - name: Verify selected .NET SDK
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '11.0.100') {
            throw 'Selected SDK differs from reviewed global.json'
          }
          Write-Host "Selected .NET SDK: $actual"
          dotnet --list-runtimes | ForEach-Object {
            if ($_ -match '^([A-Za-z0-9.]+) ([0-9.]+) \[') {
              Write-Host ("Available runtime: " + $Matches[1] + " " + $Matches[2])
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inventory failed' }
      - name: Test and build Windows
        shell: pwsh
        run: |
          dotnet run -c Release --project tests/AjazzBatteryTray.Tests/AjazzBatteryTray.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/app/AJAZZBatteryTray.exe dist/release/AJAZZBatteryTray-win-x64.exe
          $hash = (Get-FileHash dist/release/AJAZZBatteryTray-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AJAZZBatteryTray-win-x64.exe" | Set-Content -Encoding ascii dist/release/AJAZZBatteryTray-win-x64.sha256
      - name: Build Windows installer and smoke-test install/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Invoke-InstallerCompiler.ps1
          $installer = 'dist/installer/AJAZZBatteryTray-Setup-win-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer output missing' }
          $installDir = Join-Path $env:ProgramFiles 'AJAZZ Battery Tray'
          $p = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $installed = Join-Path $installDir 'AJAZZBatteryTray.exe'
          if (-not (Test-Path $installed)) { throw 'Missing EXE in Program Files' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (Test-Path $installed) { throw 'EXE remains after uninstall' }
          Copy-Item $installer dist/release/
          $hash = (Get-FileHash dist/release/AJAZZBatteryTray-Setup-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AJAZZBatteryTray-Setup-win-x64.exe" | Set-Content -Encoding ascii dist/release/AJAZZBatteryTray-Setup-win-x64.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: win-release
          path: dist/release/*
          if-no-files-found: error

  macos:
    needs: verify-version
    # Intel macOS runner avoids arm64 queue saturation; swiftc cross-builds both architectures.
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build macOS universal app
        run: bash macos/build-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: mac-release
          path: |
            dist/AJAZZBatteryTray-macOS-universal.zip
            dist/AJAZZBatteryTray-macOS-universal.sha256
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          pattern: '*-release'
          merge-multiple: true
          path: dist/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.0-beta.61"
          cat > notes.md <<'NOTES'
          ## AJAZZ Battery Tray v0.3.0-beta.61 — candidate notes

          DRAFT: release admission remains blocked. Final release notes
          must be reviewed against the exact approved artifacts.
          This candidate includes receiver identity and cached-reading
          safeguards, bounded HID diagnostics, and local diagnostic
          session export. Unverified APEX fields are not battery readings.
          Real-device acceptance, signing and distribution review remain
          required. The updated installer compiler is being qualified separately;
          the production compiler has not been switched.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; do not overwrite published binaries."
            exit 1
          else
            gh release create "$TAG" \
              dist/release/AJAZZBatteryTray-win-x64.exe \
              dist/release/AJAZZBatteryTray-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-Setup-win-x64.exe \
              dist/release/AJAZZBatteryTray-Setup-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-macOS-universal.zip \
              dist/release/AJAZZBatteryTray-macOS-universal.sha256 \
              --target "$GITHUB_SHA" --title "AJAZZ Battery Tray v0.3.0-beta.61" \
              --notes-file notes.md --latest
          fi
          # A published release must be visible through /releases/latest.
          # Fail CI if GitHub hides it as a pre-release or an asset is missing.
          PUBLISHED="repos/$GH_REPO/releases/tags/$TAG"
          if [ "$(gh api "$PUBLISHED" --jq '.draft')" != "false" ] ||
             [ "$(gh api "$PUBLISHED" --jq '.prerelease')" != "false" ]; then
            echo "::error::$TAG is not a published stable-status release."
            exit 1
          fi
          LATEST="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          if [ "$LATEST" != "$TAG" ]; then
            echo "::error::Latest points to $LATEST instead of $TAG."
            exit 1
          fi
          ASSETS="$(gh api "$PUBLISHED" --jq '.assets[].name')"
          for file in \
            AJAZZBatteryTray-win-x64.exe \
            AJAZZBatteryTray-win-x64.sha256 \
            AJAZZBatteryTray-Setup-win-x64.exe \
            AJAZZBatteryTray-Setup-win-x64.sha256 \
            AJAZZBatteryTray-macOS-universal.zip \
            AJAZZBatteryTray-macOS-universal.sha256; do
            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$file"; then
              echo "::error::Missing published release file: $file"
              exit 1
            fi
          done
          echo "PASS: $TAG is Latest and all six files are published."
