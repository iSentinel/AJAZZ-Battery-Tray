name: Publish cross-platform beta release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'macos/**'
      - 'installer/**'
  workflow_dispatch:

concurrency:
  group: ajazz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and build Windows
        shell: pwsh
        run: |
          dotnet run -c Release --project tests/AjazzBatteryTray.Tests/AjazzBatteryTray.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/app/AJAZZBatteryTray.exe dist/release/AJAZZBatteryTray-win-x64.exe
          $hash = (Get-FileHash dist/release/AJAZZBatteryTray-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AJAZZBatteryTray-win-x64.exe" | Set-Content -Encoding ascii dist/release/AJAZZBatteryTray-win-x64.sha256
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build Windows installer and smoke-test install/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc "installer\AJAZZBatteryTray.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = 'dist/installer/AJAZZBatteryTray-Setup-win-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer output missing' }
          $installDir = Join-Path $env:ProgramFiles 'AJAZZ Battery Tray'
          $p = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $installed = Join-Path $installDir 'AJAZZBatteryTray.exe'
          if (-not (Test-Path $installed)) { throw 'Missing EXE in Program Files' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (Test-Path $installed) { throw 'EXE remains after uninstall' }
          Copy-Item $installer dist/release/
          $hash = (Get-FileHash dist/release/AJAZZBatteryTray-Setup-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AJAZZBatteryTray-Setup-win-x64.exe" | Set-Content -Encoding ascii dist/release/AJAZZBatteryTray-Setup-win-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS universal app
        run: bash macos/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            dist/AJAZZBatteryTray-macOS-universal.zip
            dist/AJAZZBatteryTray-macOS-universal.sha256
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.0-beta.12"
          cat > notes.md <<'NOTES'
          ## AJAZZ Battery Tray v0.3.0-beta.12 — Windows and macOS

          Battery history, diagnostics and dock clock synchronization in
          the notification area on Windows 10/11 and the
          native menu bar on macOS 13+ (Intel or Apple Silicon).

          **Windows:** AJ179 APEX 2.4 GHz / 8K battery display confirmed on
          real hardware. The UI uses the neutral name AJAZZ APEX, and AJ159
          APEX is included as an experimental compatible receiver.

          **macOS:** first native Swift/AppKit/IOKit build. Builds on macOS
          CI, but the actual mouse's HID reply still needs real Mac testing.
          Download the macOS ZIP and extract it once to get the .app.
          The app is ad-hoc signed, not notarized by Apple. Gatekeeper may
          request approval in Privacy & Security.

          **macOS experimental Bluetooth:** Opt-in manual CoreBluetooth
          inspection of already connected AJAZZ mice with standard GATT
          Battery Service. No scanning or pairing, and no BLE status is
          substituted for 2.4 GHz. Real Mac hardware verification is pending.

          **Windows Bluetooth discovery fix:** Detect paired Bluetooth Classic
          and LE endpoints, allow an explicit "show all paired devices" option
          when Windows gives a generic mouse name, and use Windows cached
          BatteryLife only when a GATT Battery Level read is unavailable.
          Cached values are labelled and may be stale. No pairing or writes.

          **Windows reliability:** Bluetooth LE inspection has bounded UI
          timeouts and battery history tolerates backward clock corrections.

          **Windows experimental Bluetooth:** Opt-in manual inspection of
          paired AJAZZ BLE mouse candidates. User chooses the device and
          reads the standard GATT Battery Service (180F) / Level (2A19).
          No pairing, GATT writes or background BLE polling. Support
          depends on real hardware exposing the standard service.

          **Hardware acceptance:** Both platforms can copy a local
          diagnostic report to the clipboard. The release includes a
          checklist for AJ179/AJ159 and macOS hardware validation.

          **macOS Start at Login:** Optional SMAppService registration through
          the menu bar, with system state and a Login Items settings shortcut.

          **macOS Notifications:** Optional, off-by-default alerts for low
          battery at 20/10/5% and USB receiver disconnect after two missed polls.
          macOS notification permission is requested only when enabled.

          **macOS Chart:** Native battery-history graph with 24h, 7d and 30d
          views. Disconnected readings appear as gaps.

          **macOS History:** Local 30-day CSV of battery percentage and receiver
          status, optional recording, and menu shortcut to open the history.

          **HID write safety:** Both platforms reject all vendor SET_FEATURE
          opcodes except validated 0xF7 telemetry and 0x28 RTC packets.

          **Read-only dock identification:** Windows HID product name and USB
          device revision (not firmware), macOS HID product name. No device
          settings are modified by these queries.

          **Windows Monitoring:** 30-day battery history CSV and interactive
          chart (24h/7d/30d), read-only device diagnostics, optional
          receiver disconnect notification (off by default).

          **Dock Clock Sync:** Manual or five-minute automatic RTC update using
          the documented 0x28 feature report. The host writes local system time.
          Clock display update still needs real-device confirmation.

          **Protocol:** USB VID 3151 PID 5007, vendor HID usage FFFF:0002.
          **Not supported yet:** Automatic Bluetooth monitoring, charging
          state and two receivers distinguished at once.
          macOS notifications and Start at Login are now optional.

          Windows recommended installer: AJAZZBatteryTray-Setup-win-x64.exe
          Installs to Program Files, provides Start menu and standard uninstall.
          Administrator permission is required only to install/uninstall.
          Portable Windows download: AJAZZBatteryTray-win-x64.exe
          macOS download: AJAZZBatteryTray-macOS-universal.zip
          SHA256 checksum files accompany every distribution.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; do not overwrite published binaries."
            exit 1
          else
            gh release create "$TAG" \
              dist/release/AJAZZBatteryTray-win-x64.exe \
              dist/release/AJAZZBatteryTray-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-Setup-win-x64.exe \
              dist/release/AJAZZBatteryTray-Setup-win-x64.sha256 \
              dist/release/AJAZZBatteryTray-macOS-universal.zip \
              dist/release/AJAZZBatteryTray-macOS-universal.sha256 \
              --target "$GITHUB_SHA" --title "AJAZZ Battery Tray v0.3.0-beta.12" \
              --notes-file notes.md --latest
          fi
