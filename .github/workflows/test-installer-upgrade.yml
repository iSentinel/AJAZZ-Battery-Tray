name: Test Windows installer upgrade

on:
  pull_request:
    paths:
      - 'global.json'
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/test-installer-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100'
      - name: Verify selected .NET SDK
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '11.0.100') {
            throw 'Selected SDK differs from reviewed global.json'
          }
          Write-Host "Selected .NET SDK: $actual"
          dotnet --list-runtimes | ForEach-Object {
            if ($_ -match '^([A-Za-z0-9.]+) ([0-9.]+) \[') {
              Write-Host ("Available runtime: " + $Matches[1] + " " + $Matches[2])
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inventory failed' }
      - name: Build unpublished versioned upgrade candidate
        shell: pwsh
        run: |
          dotnet publish src/AjazzBatteryTray/AjazzBatteryTray.csproj -c Release -r win-x64 --self-contained true -p:Version=0.3.0-beta.61 -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Candidate publish failed' }
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Compiler install failed' }
            $iscc = @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Missing ISCC' }
          & $iscc /DAppVersion=0.3.0-beta.61 'installer/AJAZZBatteryTray.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate setup compilation failed' }
      - name: Verify baseline, upgrade, retained data and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'ajazz-beta60-setup.exe'
          $url = 'https://github.com/iSentinel/AJAZZ-Battery-Tray/releases/download/v0.3.0-beta.60/AJAZZBatteryTray-Setup-win-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $old
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '555b957b809c2f1bb4228c10a818abadad2df78e455925871713ee7779970672') {
            throw 'Published baseline hash mismatch'
          }
          $dir = Join-Path $env:ProgramFiles 'AJAZZ Battery Tray'
          $data = Join-Path $env:APPDATA 'AJAZZBatteryTray'
          $installed = Join-Path $dir 'AJAZZBatteryTray.exe'
          $uninstaller = Join-Path $dir 'unins000.exe'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{9829045F-37F0-4AC3-ACBD-1B5E4129A179}_is1'
          if ((Test-Path $dir) -or (Test-Path $data) -or (Test-Path $key)) {
            throw 'Expected clean ephemeral CI runner'
          }
          function Install-Checked([string]$Setup, [string]$Version) {
            $p = Start-Process -FilePath $Setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
            if ($p.ExitCode -ne 0 -or !(Test-Path $installed)) { throw "Install failed: $($p.ExitCode)" }
            if ((Get-ItemProperty -LiteralPath $key).DisplayVersion -ne $Version) { throw 'Unexpected registered version' }
            if (Get-Process -Name AJAZZBatteryTray -ErrorAction SilentlyContinue) { throw 'Silent install launched tray' }
          }
          try {
            Install-Checked $old '0.3.0-beta.60'
            $oldHash = (Get-FileHash $installed).Hash
            New-Item -ItemType Directory -Path $data | Out-Null
            $settings = Join-Path $data 'settings.json'
            $history = Join-Path $data 'battery-history.csv'
            '{"Language":"uk","PollSeconds":60,"AutomaticUpdateChecks":false,"AutomaticDockClockSync":false}' | Set-Content -LiteralPath $settings -Encoding utf8
            "utc_timestamp,percent,state" | Set-Content -LiteralPath $history -Encoding utf8
            "2026-11-24T00:00:00Z,83,online" | Add-Content -LiteralPath $history -Encoding utf8
            $settingsHash = (Get-FileHash $settings).Hash
            $historyHash = (Get-FileHash $history).Hash
            $candidate = (Resolve-Path 'dist/installer/AJAZZBatteryTray-Setup-win-x64.exe').Path
            Install-Checked $candidate '0.3.0-beta.61'
            $iconNames = @('AppIcon.ico','AppIcon-white.ico','AppIcon-black.ico','AppIcon-blue.ico')
            foreach ($name in $iconNames) {
              $expectedIcon = Join-Path 'src/AjazzBatteryTray/Assets' $name
              $installedIcon = Join-Path (Join-Path $dir 'Icons') $name
              if (!(Test-Path -LiteralPath $installedIcon) -or
                  (Get-FileHash $installedIcon).Hash -ne (Get-FileHash $expectedIcon).Hash) {
                throw "Missing or invalid shortcut icon: $name"
              }
            }
            $actualHash = (Get-FileHash $installed).Hash
            $expectedHash = (Get-FileHash 'dist/app/AJAZZBatteryTray.exe').Hash
            if ($actualHash -eq $oldHash -or $actualHash -ne $expectedHash) { throw 'Upgrade did not install candidate binary' }
            if ((Get-FileHash $settings).Hash -ne $settingsHash -or (Get-FileHash $history).Hash -ne $historyHash) {
              throw 'Upgrade changed user data'
            }
            $p = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($p.ExitCode -ne 0 -or (Test-Path $installed) -or (Test-Path $key)) { throw 'Uninstall failed' }
            if ((Get-FileHash $settings).Hash -ne $settingsHash -or (Get-FileHash $history).Hash -ne $historyHash) { throw 'Uninstall changed user data' }
            foreach ($name in $iconNames) {
              if (Test-Path -LiteralPath (Join-Path (Join-Path $dir 'Icons') $name)) {
                throw "Installed icon remains after uninstall: $name"
              }
            }
            Write-Host 'PASS: four installed shortcut ICO resources and uninstall cleanup'
            Write-Host 'PASS: pinned beta.60 -> unpublished beta.61 -> uninstall, settings/history preserved; no tray launch or HID'
          } finally {
            if (Test-Path $uninstaller) {
              Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            }
            if (Test-Path $data) { Remove-Item -LiteralPath $data -Recurse -Force }
            if (Test-Path $old) { Remove-Item -LiteralPath $old -Force }
          }
