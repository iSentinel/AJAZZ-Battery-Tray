name: Show newest AJAZZ release as Latest

# One-time promotion of the current beta release. Future releases are
# explicitly marked Latest by release-beta.yml.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-latest-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Mark v0.3.0-beta.12 as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.0-beta.12"
          RELEASE="repos/$GH_REPO/releases/tags/$TAG"
          ID="$(gh api "$RELEASE" --jq '.id')"
          COUNT="$(gh api "$RELEASE" --jq '.assets | length')"
          if [ "$COUNT" -lt 6 ]; then
            echo "::error::Release must contain all six distribution and checksum files."
            exit 1
          fi

          # GitHub excludes pre-releases from its Latest label.
          # Preserve the tag and all six assets; only change release flags.
          gh api --method PATCH "repos/$GH_REPO/releases/$ID" \
            -F prerelease=false -f make_latest=true --silent

          LATEST="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          if [ "$LATEST" != "$TAG" ]; then
            echo "::error::Expected Latest $TAG, got $LATEST."
            exit 1
          fi
          echo "PASS: $TAG is now GitHub's Latest release."
